<div class="container about-us-container py-5">

  <!-- Company Header -->
  <header class="text-center mb-5">
    <h1 class="company-name">{{ companyName }}</h1>
    <p class="company-description">{{ description }}</p>
  </header>

  <!-- Mission & Vision -->
  <div class="row text-center mb-5">
    <div class="col-md-6 mb-3">
      <div class="info-card p-4 shadow-sm rounded-4">
        <h3>Mission</h3>
        <p>{{ mission }}</p>
      </div>
    </div>
    <div class="col-md-6 mb-3">
      <div class="info-card p-4 shadow-sm rounded-4">
        <h3>Vision</h3>
        <p>{{ vision }}</p>
      </div>
    </div>
  </div>


  <!-- Services -->
  <section class="mb-5">
    <h2 class="section-title mb-3 text-center">Services</h2>
    <ul class="services-list row text-center">
      <li *ngFor="let service of services" class="col-6 col-md-4 p-2">
        <div class="service-card p-3 shadow-sm rounded">{{ service }}</div>
      </li>
    </ul>
  </section>




  <router-outlet></router-outlet>

</div>
